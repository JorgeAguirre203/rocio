<!DOCTYPE html>Add commentMore actions


<html lang="es">


<head>


<meta charset="UTF-8" />


<title>Cotizar Servicio</title>


</head>


<body>





<h2>Solicitar Cotización</h2>





<form action="guardar_cotizacion.php" method="POST">


    <label>Servicio:</label>


    <select name="servicio" required>


        <option value="plomeria">Plomería</option>


        <option value="electricidad">Electricidad</option>


        <option value="carpinteria">Carpintería</option>


         <option value="albañileria">albañileria</option>


    </select><br><br>





    <label>Horas estimadas:</label>


    <input type="number" name="horas" min="1" required><br><br>





    <label>Detalles del servicio:</label><br>


    <textarea name="detalles" rows="4"></textarea><br><br>





    <label>Precio por hora (MXN):</label>


    <input type="number" name="precio_hora" step="0.01" min="0" required><br><br>





    <button type="submit">Enviar Cotización</button>


</form>





</body>


</html>
